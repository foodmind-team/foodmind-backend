name: Backend CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    env:
      SPRING_PROFILES_ACTIVE: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Maven tests
        run: ./mvnw clean test
