name: Backend CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SPRING_PROFILES_ACTIVE: test

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Fix mvnw executable permission
        run: chmod +x mvnw

      - name: Validate committed OpenAPI contract
        run: python3 scripts/validate-openapi.py

      - name: Scan tracked files for common credential forms
        run: python3 scripts/check-secrets.py

      - name: Review newly introduced dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

      - name: Build and verify
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/*.jar
            target/surefire-reports/
            target/failsafe-reports/
