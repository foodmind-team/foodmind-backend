name: Backend CI

on:
  pull_request:
  push:
    branches:
      - master

env:
  SPRING_PROFILES_ACTIVE: test
  POSTGRES_DB: foodmind_test
  POSTGRES_USER: foodmind
  POSTGRES_PASSWORD: foodmind_test_password

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fix mvnw executable permission
        run: chmod +x mvnw

      - name: Install PostgreSQL client & netcat
        run: sudo apt-get update && sudo apt-get install -y postgresql-client netcat-openbsd

      - name: Wait for PostgreSQL to be fully ready
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          for i in {1..120}; do
            if nc -z 127.0.0.1 5432 2>/dev/null; then
              pg_isready -h 127.0.0.1 -p 5432 -U $POSTGRES_USER -d $POSTGRES_DB \
                && echo "PostgreSQL is ready after $i seconds" \
                && exit 0
            fi
            echo "⏳ Waiting for PostgreSQL... ($i/120)"
            sleep 1
          done

          echo "PostgreSQL failed to start within 120 seconds"
          echo "--- Docker containers ---"
          docker ps -a
          echo "--- PostgreSQL logs ---"
          docker ps --filter "ancestor=postgres:15-alpine" -q | xargs -r docker logs --tail 200
          exit 1

      - name: Run all tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/${{ env.POSTGRES_DB }}
          SPRING_DATASOURCE_USERNAME: ${{ env.POSTGRES_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: ./mvnw clean test