name: Backend CI

on:
  pull_request:
  push:

env:
  SPRING_PROFILES_ACTIVE: test

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fix mvnw executable permission
        run: chmod +x mvnw

      - name: Validate committed OpenAPI contract
        run: python3 scripts/validate-openapi.py

      - name: Run all tests
        run: ./mvnw clean test
