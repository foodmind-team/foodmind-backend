name: Backend CI

on:
  pull_request:
  push:
    branches:
      - master

env:
  SPRING_PROFILES_ACTIVE: test
  POSTGRES_DB: foodmind_test
  POSTGRES_USER: foodmind
  POSTGRES_PASSWORD: foodmind_test_password

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fix mvnw executable permission
        run: chmod +x mvnw

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL to be fully ready
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          for i in {1..120}; do
            if pg_isready -h postgres -p 5432 -U $POSTGRES_USER -d $POSTGRES_DB >/dev/null 2>&1; then
              echo "PostgreSQL is ready after $i seconds" && exit 0
            fi
            echo "⏳ Waiting for PostgreSQL... ($i/120)"
            sleep 1
          done

          echo "PostgreSQL failed to start within 180 seconds"
          echo "--- Docker containers ---"
          docker ps -a
          echo "--- PostgreSQL container logs (last 500 lines) ---"
          docker ps --filter "ancestor=postgres:15" -q | xargs -r docker logs --tail 500 || true
          echo "--- System journal for docker (if available) ---"
          journalctl -u docker --no-pager --since "5 minutes ago" || true
          exit 1

      - name: Run all tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${{ env.POSTGRES_DB }}
          SPRING_DATASOURCE_USERNAME: ${{ env.POSTGRES_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: ./mvnw clean test