spring.application.name=foodmind-backend

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:3000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'; SET search_path TO public, pg_temp

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.init-sqls[0]=SET search_path TO public, pg_temp

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=false

foodmind.recommendation.agent.enabled=${RECOMMENDATION_AGENT_ENABLED:false}
foodmind.recommendation.agent.base-url=${RECOMMENDATION_AGENT_BASE_URL:http://127.0.0.1:65535}
foodmind.recommendation.agent.endpoint-path=${RECOMMENDATION_AGENT_ENDPOINT_PATH:/internal/v1/recommendations/generate}
foodmind.recommendation.agent.service-token=${RECOMMENDATION_AGENT_SERVICE_TOKEN:}
foodmind.recommendation.agent.contract-version=${RECOMMENDATION_AGENT_CONTRACT_VERSION:recommendation-agent-v1}
foodmind.recommendation.agent.connect-timeout=${RECOMMENDATION_AGENT_CONNECT_TIMEOUT:250ms}
foodmind.recommendation.agent.read-timeout=${RECOMMENDATION_AGENT_READ_TIMEOUT:800ms}
foodmind.recommendation.agent.max-response-bytes=${RECOMMENDATION_AGENT_MAX_RESPONSE_BYTES:16384}

foodmind.cooking.agent.enabled=${COOKING_AGENT_ENABLED:false}
foodmind.cooking.agent.base-url=${COOKING_AGENT_BASE_URL:http://127.0.0.1:65535}
foodmind.cooking.agent.endpoint-path=${COOKING_AGENT_ENDPOINT_PATH:/internal/v1/cooking-plans/generate}
foodmind.cooking.agent.service-token=${COOKING_AGENT_SERVICE_TOKEN:}
foodmind.cooking.agent.contract-version=${COOKING_AGENT_CONTRACT_VERSION:cooking-agent-v1}
foodmind.cooking.agent.connect-timeout=${COOKING_AGENT_CONNECT_TIMEOUT:250ms}
foodmind.cooking.agent.read-timeout=${COOKING_AGENT_READ_TIMEOUT:800ms}
foodmind.cooking.agent.max-response-bytes=${COOKING_AGENT_MAX_RESPONSE_BYTES:16384}

foodmind.chat.agent.enabled=${CHAT_AGENT_ENABLED:false}
foodmind.chat.agent.base-url=${CHAT_AGENT_BASE_URL:http://127.0.0.1:65535}
foodmind.chat.agent.endpoint-path=${CHAT_AGENT_ENDPOINT_PATH:/internal/v1/chat/generate}
foodmind.chat.agent.service-token=${CHAT_AGENT_SERVICE_TOKEN:}
foodmind.chat.agent.contract-version=${CHAT_AGENT_CONTRACT_VERSION:chat-agent-v1}
foodmind.chat.agent.connect-timeout=${CHAT_AGENT_CONNECT_TIMEOUT:250ms}
foodmind.chat.agent.read-timeout=${CHAT_AGENT_READ_TIMEOUT:800ms}
foodmind.chat.agent.max-response-bytes=${CHAT_AGENT_MAX_RESPONSE_BYTES:16384}

foodmind.security.delegation.audience=${DELEGATION_JWT_AUDIENCE:foodmind-agent-tools}
foodmind.security.delegation.token-ttl=${DELEGATION_JWT_TOKEN_TTL:2m}
foodmind.security.internal-service.token=${INTERNAL_SERVICE_TOKEN:}
