spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foodmind}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

logging.level.com.foodmind=DEBUG
logging.level.org.flywaydb=INFO
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

foodmind.security.jwt.issuer=${JWT_ISSUER:foodmind-local}
foodmind.security.jwt.audience=${JWT_AUDIENCE:foodmind-clients}
foodmind.security.jwt.public-key=${JWT_PUBLIC_KEY:local-development-placeholder}
foodmind.security.delegation.issuer=${DELEGATION_JWT_ISSUER:foodmind-backend-local}
foodmind.integration.agent.base-url=${AGENT_SERVICE_BASE_URL:http://localhost:8001}
foodmind.integration.inference.base-url=${INFERENCE_SERVICE_BASE_URL:http://localhost:8002}
