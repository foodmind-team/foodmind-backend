spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foodmind}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

logging.level.com.foodmind=DEBUG
logging.level.org.flywaydb=INFO
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

foodmind.security.jwt.issuer=${JWT_ISSUER:foodmind-local}
foodmind.security.jwt.audience=${JWT_AUDIENCE:foodmind-clients}
foodmind.security.jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-me-at-least-32-bytes}
foodmind.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
foodmind.security.jwt.public-key=${JWT_PUBLIC_KEY:local-development-placeholder}
foodmind.security.refresh.token-ttl=${REFRESH_TOKEN_TTL:30d}
foodmind.security.refresh.cleanup-retention=${REFRESH_CLEANUP_RETENTION:7d}
foodmind.security.web.allowed-origins=${WEB_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
foodmind.security.web.cookie-secure=${WEB_COOKIE_SECURE:false}
foodmind.security.delegation.audience=${DELEGATION_JWT_AUDIENCE:foodmind-agent-tools}
foodmind.security.delegation.token-ttl=${DELEGATION_JWT_TOKEN_TTL:2m}
foodmind.security.internal-service.token=${INTERNAL_SERVICE_TOKEN:}
foodmind.integration.agent.base-url=${AGENT_SERVICE_BASE_URL:http://localhost:8004}
foodmind.integration.inference.base-url=${INFERENCE_SERVICE_BASE_URL:http://localhost:8002}

foodmind.media.storage.enabled=${MEDIA_ENABLED:false}
foodmind.media.storage.bucket=${MEDIA_S3_BUCKET:foodmind-media}
foodmind.media.storage.endpoint=${MEDIA_S3_ENDPOINT:http://localhost:9000}
