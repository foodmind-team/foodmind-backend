spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

logging.level.com.foodmind=INFO
logging.level.org.flywaydb=INFO

foodmind.security.jwt.issuer=${JWT_ISSUER}
foodmind.security.jwt.audience=${JWT_AUDIENCE}
foodmind.security.jwt.public-key=${JWT_PUBLIC_KEY}
foodmind.security.delegation.issuer=${DELEGATION_JWT_ISSUER}
foodmind.security.delegation.public-key=${DELEGATION_JWT_PUBLIC_KEY}
foodmind.integration.agent.base-url=${AGENT_SERVICE_BASE_URL}
foodmind.integration.agent.token=${AGENT_SERVICE_TOKEN}
foodmind.integration.inference.base-url=${INFERENCE_SERVICE_BASE_URL}
foodmind.integration.inference.token=${INFERENCE_SERVICE_TOKEN}

spring.jpa.show-sql=false
management.endpoint.health.show-details=never
