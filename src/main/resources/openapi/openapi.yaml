openapi: 3.1.0
info:
  title: FoodMind Backend API
  version: v1
  description: Public API contract for FoodMind clients.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    CorrelationId:
      description: Accepted or generated request correlation identifier.
      schema:
        type: string
        maxLength: 128
      example: postman-correlation-test
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional client-generated correlation identifier.
      schema:
        type: string
        maxLength: 128
      example: postman-correlation-test
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable key for retrying commands that must not duplicate work.
      schema:
        type: string
        maxLength: 128
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Bounded page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: Sort field and direction, for example createdAt,desc.
      schema:
        type: string
  schemas:
    ApiFieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          example: price
        code:
          type: string
          example: POSITIVE_OR_ZERO
        message:
          type: string
          example: Price must be zero or greater.
    ApiErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - code
        - message
        - path
        - traceId
        - fieldErrors
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-07-28T10:15:30Z"
        status:
          type: integer
          example: 400
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - MALFORMED_JSON
            - AUTHENTICATION_REQUIRED
            - ACCESS_DENIED
            - RESOURCE_NOT_FOUND
            - CONFLICT
            - IDEMPOTENCY_CONFLICT
            - RATE_LIMITED
            - UPSTREAM_UNAVAILABLE
            - INTERNAL_ERROR
          example: VALIDATION_ERROR
        message:
          type: string
          example: The request contains invalid fields.
        path:
          type: string
          example: /api/v1/food-records
        traceId:
          type: string
          example: trace-123
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/ApiFieldError'
    PageResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalItems
        - totalPages
        - hasNext
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        totalItems:
          type: integer
          format: int64
          minimum: 0
          example: 0
        totalPages:
          type: integer
          minimum: 0
          example: 0
        hasNext:
          type: boolean
          example: false
    RegisterRequest:
      type: object
      required:
        - email
        - displayName
        - password
        - clientType
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: primary@example.test
        displayName:
          type: string
          maxLength: 100
          example: Primary User
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: correct horse battery
        timeZone:
          type: string
          maxLength: 64
          example: Asia/Singapore
        clientType:
          type: string
          enum:
            - WEB
            - ANDROID
          example: WEB
        deviceLabel:
          type: string
          maxLength: 100
          example: Pixel 9
    LoginRequest:
      type: object
      required:
        - email
        - password
        - clientType
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: primary@example.test
        password:
          type: string
          format: password
          maxLength: 128
          example: correct horse battery
        clientType:
          type: string
          enum:
            - WEB
            - ANDROID
          example: WEB
        deviceLabel:
          type: string
          maxLength: 100
          example: Chrome on Windows
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 4096
          description: Opaque refresh token for Android/Postman clients. Web clients may use the Secure HttpOnly cookie instead.
          example: redacted-refresh-token
        clientType:
          type: string
          enum:
            - WEB
            - ANDROID
          example: ANDROID
    AuthTokenResponse:
      type: object
      required:
        - userId
        - accessToken
        - tokenType
        - expiresIn
        - expiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - csrfToken
      properties:
        userId:
          type: string
          format: uuid
          example: 018fd1e4-5e5d-7a30-90d4-8d0d3f7f5d9c
        accessToken:
          type: string
          description: Short-lived signed JWT access token.
          example: redacted-access-jwt
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          example: 900
        expiresAt:
          type: string
          format: date-time
          example: "2026-07-29T12:30:00Z"
        refreshToken:
          type: string
          description: Opaque refresh token returned once; only a SHA-256 hash is stored by the backend.
          example: redacted-refresh-token
        refreshTokenExpiresAt:
          type: string
          format: date-time
          example: "2026-08-28T12:15:00Z"
        csrfToken:
          type: string
          description: CSRF companion value for cookie-based web refresh/logout.
          example: redacted-csrf-token
    CurrentUserResponse:
      type: object
      required:
        - id
        - email
        - displayName
        - role
        - status
        - timeZone
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: 018fd1e4-5e5d-7a30-90d4-8d0d3f7f5d9c
        email:
          type: string
          format: email
          example: primary@example.test
        displayName:
          type: string
          example: Primary User
        role:
          type: string
          enum:
            - USER
            - ADMIN
          example: USER
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - DEACTIVATED
          example: ACTIVE
        timeZone:
          type: string
          example: Asia/Singapore
        version:
          type: integer
          format: int64
          example: 0
        createdAt:
          type: string
          format: date-time
          example: "2026-07-29T12:15:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-07-29T12:15:00Z"
    UpdateCurrentUserRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
          example: Primary User Updated
        timeZone:
          type: string
          maxLength: 64
          description: IANA timezone identifier.
          example: Asia/Singapore
    AllergenPreferenceRequest:
      type: object
      required:
        - code
        - severity
      properties:
        code:
          type: string
          maxLength: 40
          example: PEANUT
        severity:
          type: string
          maxLength: 20
          example: SEVERE
    AllergenPreference:
      type: object
      required:
        - code
        - severity
      properties:
        code:
          type: string
          example: PEANUT
        severity:
          type: string
          example: SEVERE
    ReplacePreferencesRequest:
      type: object
      properties:
        budgetMin:
          type: number
          minimum: 0
          example: 5
        budgetMax:
          type: number
          minimum: 0
          example: 25
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: SGD
        spiceTolerance:
          type: integer
          minimum: 0
          maximum: 5
          example: 3
        preferredArea:
          type: string
          maxLength: 120
          example: Tiong Bahru
        preferredLatitude:
          type: number
          minimum: -90
          maximum: 90
          example: 1.284
        preferredLongitude:
          type: number
          minimum: -180
          maximum: 180
          example: 103.832
        maxDistanceKm:
          type: number
          exclusiveMinimum: 0
          example: 8
        cleanlinessPriority:
          type: integer
          minimum: 0
          maximum: 5
          example: 4
        minimumCleanlinessEvidenceScore:
          type: number
          minimum: 0
          maximum: 1
          description: Decision-support evidence threshold, not a safety certification.
          example: 0.7
        foodGoal:
          type: string
          maxLength: 40
          example: BALANCED
        drinkSweetnessPreference:
          type: string
          maxLength: 20
          example: LOW
        drinkIcePreference:
          type: string
          maxLength: 20
          example: LESS
        likedCuisineCodes:
          type: array
          items:
            type: string
          example:
            - SINGAPOREAN
            - INDIAN
        dislikedCuisineCodes:
          type: array
          items:
            type: string
          example:
            - JAPANESE
        dietaryTagCodes:
          type: array
          description: Required dietary tags; these are hard constraints.
          items:
            type: string
          example:
            - VEGETARIAN
        allergens:
          type: array
          description: User-declared allergens; these are hard constraints.
          items:
            $ref: '#/components/schemas/AllergenPreferenceRequest'
        preferredMealTypes:
          type: array
          items:
            type: string
          example:
            - LUNCH
            - DINNER
    HardConstraintSummary:
      type: object
      required:
        - requiredDietaryTagCodes
        - allergens
      properties:
        requiredDietaryTagCodes:
          type: array
          items:
            type: string
        allergens:
          type: array
          items:
            $ref: '#/components/schemas/AllergenPreference'
    UserPreferencesResponse:
      allOf:
        - $ref: '#/components/schemas/ReplacePreferencesRequest'
        - type: object
          required:
            - currency
            - cleanlinessPriority
            - likedCuisineCodes
            - dislikedCuisineCodes
            - dietaryTagCodes
            - allergens
            - preferredMealTypes
            - hardConstraints
            - version
          properties:
            allergens:
              type: array
              items:
                $ref: '#/components/schemas/AllergenPreference'
            hardConstraints:
              $ref: '#/components/schemas/HardConstraintSummary'
            createdAt:
              type: string
              format: date-time
              nullable: true
              example: "2026-07-29T12:15:00Z"
            updatedAt:
              type: string
              format: date-time
              nullable: true
              example: "2026-07-29T12:15:00Z"
            version:
              type: integer
              format: int64
              example: 1
    CatalogueReferenceItem:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: string
          format: uuid
          example: 10000000-0000-4000-8000-000000000001
        code:
          type: string
          example: SINGAPOREAN
        name:
          type: string
          example: Singaporean
    CatalogueReferenceDataResponse:
      type: object
      required:
        - cuisines
        - dietaryTags
        - allergens
        - mealTypes
        - placeTypes
      properties:
        cuisines:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueReferenceItem'
        dietaryTags:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueReferenceItem'
        allergens:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueReferenceItem'
        mealTypes:
          type: array
          items:
            type: string
          example:
            - BREAKFAST
            - LUNCH
            - DINNER
        placeTypes:
          type: array
          items:
            type: string
          example:
            - CAFE
            - CASUAL_DINING
            - HAWKER_STALL
    CatalogueMoney:
      type: object
      nullable: true
      required:
        - amount
        - currency
      properties:
        amount:
          type: number
          minimum: 0
          example: 7.50
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: SGD
    CataloguePlaceSummary:
      type: object
      nullable: true
      required:
        - id
        - name
        - area
        - placeType
      properties:
        id:
          type: string
          format: uuid
          example: 21000000-0000-4000-8000-000000000001
        name:
          type: string
          example: Orchard Garden Kitchen
        area:
          type: string
          example: Orchard
        placeType:
          type: string
          example: CASUAL_DINING
    CatalogueMealOffering:
      type: object
      required:
        - id
        - displayName
        - price
        - place
      properties:
        id:
          type: string
          format: uuid
          example: 22000000-0000-4000-8000-000000000001
        displayName:
          type: string
          example: Garden Chicken Rice
        price:
          $ref: '#/components/schemas/CatalogueMoney'
        spiceLevel:
          type: integer
          nullable: true
          minimum: 0
          maximum: 5
          example: 0
        availabilityNote:
          type: string
          nullable: true
          example: Synthetic demo availability; verify before travel.
        place:
          $ref: '#/components/schemas/CataloguePlaceSummary'
    CatalogueMealResponse:
      type: object
      required:
        - id
        - name
        - cuisine
        - mealType
        - dietaryTagCodes
        - allergenCodes
        - offerings
      properties:
        id:
          type: string
          format: uuid
          example: 20000000-0000-4000-8000-000000000001
        name:
          type: string
          example: Hainanese Chicken Rice
        description:
          type: string
          nullable: true
          example: Poached chicken with fragrant rice, cucumber, and a light soy dressing.
        cuisine:
          $ref: '#/components/schemas/CatalogueReferenceItem'
        mealType:
          type: string
          example: LUNCH
        defaultSpiceLevel:
          type: integer
          nullable: true
          minimum: 0
          maximum: 5
          example: 0
        dietaryTagCodes:
          type: array
          items:
            type: string
          example: []
        allergenCodes:
          type: array
          items:
            type: string
          example:
            - GLUTEN
            - SOY
        offerings:
          type: array
          description: Active place-specific offerings; this is the eat-out recommendation candidate context.
          items:
            $ref: '#/components/schemas/CatalogueMealOffering'
    CatalogueCoordinates:
      type: object
      nullable: true
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 1.304800
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: 103.831800
    CataloguePlaceObservation:
      type: object
      required:
        - id
        - observationType
        - score
        - sourceKind
        - observedAt
      properties:
        id:
          type: string
          format: uuid
          example: 24000000-0000-4000-8000-000000000001
        observationType:
          type: string
          example: CLEANLINESS
        score:
          type: number
          minimum: 0
          maximum: 1
          description: Decision-support evidence score, not an inspection or safety certification.
          example: 0.86
        note:
          type: string
          nullable: true
          example: Synthetic demo curation observation; not an inspection or safety certification.
        sourceKind:
          type: string
          example: CURATED_DEMO
        observedAt:
          type: string
          format: date-time
          example: "2026-07-21T04:00:00Z"
    CataloguePlaceOffering:
      type: object
      required:
        - id
        - displayName
        - price
        - mealId
        - mealName
        - mealType
        - cuisineCode
      properties:
        id:
          type: string
          format: uuid
          example: 22000000-0000-4000-8000-000000000001
        displayName:
          type: string
          example: Garden Chicken Rice
        price:
          $ref: '#/components/schemas/CatalogueMoney'
        spiceLevel:
          type: integer
          nullable: true
          minimum: 0
          maximum: 5
          example: 0
        availabilityNote:
          type: string
          nullable: true
          example: Synthetic demo availability; verify before travel.
        mealId:
          type: string
          format: uuid
          example: 20000000-0000-4000-8000-000000000001
        mealName:
          type: string
          example: Hainanese Chicken Rice
        mealType:
          type: string
          example: LUNCH
        cuisineCode:
          type: string
          example: SINGAPOREAN
    CataloguePlaceResponse:
      type: object
      required:
        - id
        - name
        - placeType
        - area
        - observations
        - offerings
      properties:
        id:
          type: string
          format: uuid
          example: 21000000-0000-4000-8000-000000000001
        name:
          type: string
          example: Orchard Garden Kitchen
        placeType:
          type: string
          example: CASUAL_DINING
        area:
          type: string
          example: Orchard
        addressText:
          type: string
          nullable: true
          example: FoodMind synthetic demo listing, Orchard area
        coordinates:
          $ref: '#/components/schemas/CatalogueCoordinates'
        priceBand:
          type: integer
          nullable: true
          minimum: 1
          maximum: 4
          example: 2
        observations:
          type: array
          items:
            $ref: '#/components/schemas/CataloguePlaceObservation'
        offerings:
          type: array
          items:
            $ref: '#/components/schemas/CataloguePlaceOffering'
    CatalogueProductResponse:
      type: object
      required:
        - id
        - name
        - dietaryTagCodes
        - allergenCodes
      properties:
        id:
          type: string
          format: uuid
          example: 23000000-0000-4000-8000-000000000001
        name:
          type: string
          example: Unsweetened Soy Drink
        brand:
          type: string
          nullable: true
          example: FoodMind Demo
        description:
          type: string
          nullable: true
          example: Shelf-stable unsweetened soy drink used as controlled demo catalogue data.
        price:
          $ref: '#/components/schemas/CatalogueMoney'
        place:
          $ref: '#/components/schemas/CataloguePlaceSummary'
        dietaryTagCodes:
          type: array
          items:
            type: string
          example:
            - VEGAN
            - VEGETARIAN
        allergenCodes:
          type: array
          items:
            type: string
          example:
            - SOY
  responses:
    BadRequest:
      description: Request validation or JSON parsing failed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Authentication is required or invalid.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: Authenticated principal is not permitted.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Resource was not found or cannot be disclosed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: Request conflicts with current resource state.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    TooManyRequests:
      description: Request rate limit exceeded.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ServiceUnavailable:
      description: Upstream dependency is unavailable.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    InternalError:
      description: Unexpected safe server error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a user and issue tokens.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered and session created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              description: Secure HttpOnly refresh cookie and CSRF companion cookie for web clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate with email and password.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials accepted and session created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              description: Secure HttpOnly refresh cookie and CSRF companion cookie for web clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /catalogue/reference-data:
    get:
      tags:
        - Catalogue
      summary: Read controlled catalogue reference choices.
      description: Returns stable cuisine, dietary-tag, allergen, meal-type, and place-type choices from the controlled catalogue.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Controlled catalogue reference choices.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueReferenceDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /catalogue/meals/{id}:
    get:
      tags:
        - Catalogue
      summary: Read an active controlled meal.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 20000000-0000-4000-8000-000000000001
      responses:
        '200':
          description: Active meal detail with active place-specific offerings.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueMealResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /catalogue/places/{id}:
    get:
      tags:
        - Catalogue
      summary: Read an active controlled place.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 21000000-0000-4000-8000-000000000001
      responses:
        '200':
          description: Active place detail with decision-support observations and active offerings.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CataloguePlaceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /catalogue/products/{id}:
    get:
      tags:
        - Catalogue
      summary: Read an active controlled food product.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
