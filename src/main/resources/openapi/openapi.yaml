openapi: 3.1.0
info:
  title: FoodMind Backend API
  version: v1
  description: Public API contract for FoodMind clients.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    CorrelationId:
      description: Accepted or generated request correlation identifier.
      schema:
        type: string
        maxLength: 128
      example: postman-correlation-test
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional client-generated correlation identifier.
      schema:
        type: string
        maxLength: 128
      example: postman-correlation-test
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable key for retrying commands that must not duplicate work.
      schema:
        type: string
        maxLength: 128
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Bounded page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: Sort field and direction, for example createdAt,desc.
      schema:
        type: string
  schemas:
    ApiFieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          example: price
        code:
          type: string
          example: POSITIVE_OR_ZERO
        message:
          type: string
          example: Price must be zero or greater.
    ApiErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - code
        - message
        - path
        - traceId
        - fieldErrors
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-07-28T10:15:30Z"
        status:
          type: integer
          example: 400
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - MALFORMED_JSON
            - AUTHENTICATION_REQUIRED
            - ACCESS_DENIED
            - RESOURCE_NOT_FOUND
            - CONFLICT
            - IDEMPOTENCY_CONFLICT
            - RATE_LIMITED
            - UPSTREAM_UNAVAILABLE
            - INTERNAL_ERROR
          example: VALIDATION_ERROR
        message:
          type: string
          example: The request contains invalid fields.
        path:
          type: string
          example: /api/v1/food-records
        traceId:
          type: string
          example: trace-123
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/ApiFieldError'
    PageResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalItems
        - totalPages
        - hasNext
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        totalItems:
          type: integer
          format: int64
          minimum: 0
          example: 0
        totalPages:
          type: integer
          minimum: 0
          example: 0
        hasNext:
          type: boolean
          example: false
  responses:
    BadRequest:
      description: Request validation or JSON parsing failed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Authentication is required or invalid.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: Authenticated principal is not permitted.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Resource was not found or cannot be disclosed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: Request conflicts with current resource state.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    TooManyRequests:
      description: Request rate limit exceeded.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ServiceUnavailable:
      description: Upstream dependency is unavailable.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    InternalError:
      description: Unexpected safe server error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
paths: {}
