openapi: 3.1.0
info:
  title: FoodMind Backend API
  version: v1
  description: Public API contract for FoodMind clients.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    CorrelationId:
      description: Accepted or generated request correlation identifier.
      schema:
        type: string
        maxLength: 128
      example: postman-correlation-test
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional client-generated correlation identifier.
      schema:
        type: string
        maxLength: 128
      example: postman-correlation-test
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable key for retrying commands that must not duplicate work.
      schema:
        type: string
        maxLength: 128
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Bounded page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: Sort field and direction, for example createdAt,desc.
      schema:
        type: string
  schemas:
    ApiFieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          example: price
        code:
          type: string
          example: POSITIVE_OR_ZERO
        message:
          type: string
          example: Price must be zero or greater.
    ApiErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - code
        - message
        - path
        - traceId
        - fieldErrors
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-07-28T10:15:30Z"
        status:
          type: integer
          example: 400
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - MALFORMED_JSON
            - AUTHENTICATION_REQUIRED
            - ACCESS_DENIED
            - RESOURCE_NOT_FOUND
            - CONFLICT
            - IDEMPOTENCY_CONFLICT
            - RATE_LIMITED
            - UPSTREAM_UNAVAILABLE
            - INTERNAL_ERROR
          example: VALIDATION_ERROR
        message:
          type: string
          example: The request contains invalid fields.
        path:
          type: string
          example: /api/v1/food-records
        traceId:
          type: string
          example: trace-123
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/ApiFieldError'
    PageResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalItems
        - totalPages
        - hasNext
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        totalItems:
          type: integer
          format: int64
          minimum: 0
          example: 0
        totalPages:
          type: integer
          minimum: 0
          example: 0
        hasNext:
          type: boolean
          example: false
    RegisterRequest:
      type: object
      required:
        - email
        - displayName
        - password
        - clientType
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: primary@example.test
        displayName:
          type: string
          maxLength: 100
          example: Primary User
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: correct horse battery
        timeZone:
          type: string
          maxLength: 64
          example: Asia/Singapore
        clientType:
          type: string
          enum:
            - WEB
            - ANDROID
          example: WEB
        deviceLabel:
          type: string
          maxLength: 100
          example: Pixel 9
    LoginRequest:
      type: object
      required:
        - email
        - password
        - clientType
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: primary@example.test
        password:
          type: string
          format: password
          maxLength: 128
          example: correct horse battery
        clientType:
          type: string
          enum:
            - WEB
            - ANDROID
          example: WEB
        deviceLabel:
          type: string
          maxLength: 100
          example: Chrome on Windows
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 4096
          description: Opaque refresh token for Android/Postman clients. Web clients may use the Secure HttpOnly cookie instead.
          example: redacted-refresh-token
        clientType:
          type: string
          enum:
            - WEB
            - ANDROID
          example: ANDROID
    AuthTokenResponse:
      type: object
      required:
        - userId
        - accessToken
        - tokenType
        - expiresIn
        - expiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - csrfToken
      properties:
        userId:
          type: string
          format: uuid
          example: 018fd1e4-5e5d-7a30-90d4-8d0d3f7f5d9c
        accessToken:
          type: string
          description: Short-lived signed JWT access token.
          example: redacted-access-jwt
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          example: 900
        expiresAt:
          type: string
          format: date-time
          example: "2026-07-29T12:30:00Z"
        refreshToken:
          type: string
          description: Opaque refresh token returned once; only a SHA-256 hash is stored by the backend.
          example: redacted-refresh-token
        refreshTokenExpiresAt:
          type: string
          format: date-time
          example: "2026-08-28T12:15:00Z"
        csrfToken:
          type: string
          description: CSRF companion value for cookie-based web refresh/logout.
          example: redacted-csrf-token
    CurrentUserResponse:
      type: object
      required:
        - id
        - email
        - displayName
        - role
        - status
        - timeZone
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: 018fd1e4-5e5d-7a30-90d4-8d0d3f7f5d9c
        email:
          type: string
          format: email
          example: primary@example.test
        displayName:
          type: string
          example: Primary User
        role:
          type: string
          enum:
            - USER
            - ADMIN
          example: USER
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - DEACTIVATED
          example: ACTIVE
        timeZone:
          type: string
          example: Asia/Singapore
        version:
          type: integer
          format: int64
          example: 0
        createdAt:
          type: string
          format: date-time
          example: "2026-07-29T12:15:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-07-29T12:15:00Z"
    UpdateCurrentUserRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
          example: Primary User Updated
        timeZone:
          type: string
          maxLength: 64
          description: IANA timezone identifier.
          example: Asia/Singapore
    AllergenPreferenceRequest:
      type: object
      required:
        - code
        - severity
      properties:
        code:
          type: string
          maxLength: 40
          example: PEANUT
        severity:
          type: string
          maxLength: 20
          example: SEVERE
    AllergenPreference:
      type: object
      required:
        - code
        - severity
      properties:
        code:
          type: string
          example: PEANUT
        severity:
          type: string
          example: SEVERE
    ReplacePreferencesRequest:
      type: object
      properties:
        budgetMin:
          type: number
          minimum: 0
          example: 5
        budgetMax:
          type: number
          minimum: 0
          example: 25
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: SGD
        spiceTolerance:
          type: integer
          minimum: 0
          maximum: 5
          example: 3
        preferredArea:
          type: string
          maxLength: 120
          example: Tiong Bahru
        preferredLatitude:
          type: number
          minimum: -90
          maximum: 90
          example: 1.284
        preferredLongitude:
          type: number
          minimum: -180
          maximum: 180
          example: 103.832
        maxDistanceKm:
          type: number
          exclusiveMinimum: 0
          example: 8
        cleanlinessPriority:
          type: integer
          minimum: 0
          maximum: 5
          example: 4
        minimumCleanlinessEvidenceScore:
          type: number
          minimum: 0
          maximum: 1
          description: Decision-support evidence threshold, not a safety certification.
          example: 0.7
        foodGoal:
          type: string
          maxLength: 40
          example: BALANCED
        drinkSweetnessPreference:
          type: string
          maxLength: 20
          example: LOW
        drinkIcePreference:
          type: string
          maxLength: 20
          example: LESS
        likedCuisineCodes:
          type: array
          items:
            type: string
          example:
            - SINGAPOREAN
            - INDIAN
        dislikedCuisineCodes:
          type: array
          items:
            type: string
          example:
            - JAPANESE
        dietaryTagCodes:
          type: array
          description: Required dietary tags; these are hard constraints.
          items:
            type: string
          example:
            - VEGETARIAN
        allergens:
          type: array
          description: User-declared allergens; these are hard constraints.
          items:
            $ref: '#/components/schemas/AllergenPreferenceRequest'
        preferredMealTypes:
          type: array
          items:
            type: string
          example:
            - LUNCH
            - DINNER
    HardConstraintSummary:
      type: object
      required:
        - requiredDietaryTagCodes
        - allergens
      properties:
        requiredDietaryTagCodes:
          type: array
          items:
            type: string
        allergens:
          type: array
          items:
            $ref: '#/components/schemas/AllergenPreference'
    UserPreferencesResponse:
      allOf:
        - $ref: '#/components/schemas/ReplacePreferencesRequest'
        - type: object
          required:
            - currency
            - cleanlinessPriority
            - likedCuisineCodes
            - dislikedCuisineCodes
            - dietaryTagCodes
            - allergens
            - preferredMealTypes
            - hardConstraints
            - version
          properties:
            allergens:
              type: array
              items:
                $ref: '#/components/schemas/AllergenPreference'
            hardConstraints:
              $ref: '#/components/schemas/HardConstraintSummary'
            createdAt:
              type: string
              format: date-time
              nullable: true
              example: "2026-07-29T12:15:00Z"
            updatedAt:
              type: string
              format: date-time
              nullable: true
              example: "2026-07-29T12:15:00Z"
            version:
              type: integer
              format: int64
              example: 1
  responses:
    BadRequest:
      description: Request validation or JSON parsing failed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Authentication is required or invalid.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: Authenticated principal is not permitted.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Resource was not found or cannot be disclosed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: Request conflicts with current resource state.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    TooManyRequests:
      description: Request rate limit exceeded.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ServiceUnavailable:
      description: Upstream dependency is unavailable.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    InternalError:
      description: Unexpected safe server error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a user and issue tokens.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered and session created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              description: Secure HttpOnly refresh cookie and CSRF companion cookie for web clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate with email and password.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials accepted and session created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              description: Secure HttpOnly refresh cookie and CSRF companion cookie for web clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Rotate a refresh session and issue a new access token.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refresh token rotated.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              description: Replacement refresh and CSRF cookies for web clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Revoke the supplied refresh session.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Refresh session revoked and auth cookies cleared.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              description: Expired refresh and CSRF cookies.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout-all:
    post:
      tags:
        - Authentication
      summary: Revoke every active refresh session for the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Active refresh sessions revoked and auth cookies cleared.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              description: Expired refresh and CSRF cookies.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      tags:
        - Users
      summary: Read the authenticated user's profile.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current authenticated user.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - Users
      summary: Update the authenticated user's mutable profile fields.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200':
          description: Updated authenticated user.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/preferences:
    get:
      tags:
        - User Preferences
      summary: Read the authenticated user's preference aggregate.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current authenticated user's preferences.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - User Preferences
      summary: Replace the authenticated user's complete preference aggregate.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePreferencesRequest'
      responses:
        '200':
          description: Replaced preference aggregate.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
