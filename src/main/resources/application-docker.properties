spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/foodmind}
spring.datasource.username=${DB_USERNAME:foodmind}
spring.datasource.password=${DB_PASSWORD:foodmind_local_password}

logging.level.com.foodmind=INFO
logging.level.org.flywaydb=INFO

foodmind.security.jwt.issuer=${JWT_ISSUER:foodmind-docker}
foodmind.security.jwt.audience=${JWT_AUDIENCE:foodmind-clients}
foodmind.security.jwt.public-key=${JWT_PUBLIC_KEY:docker-development-placeholder}
foodmind.security.delegation.issuer=${DELEGATION_JWT_ISSUER:foodmind-backend-docker}
foodmind.integration.agent.base-url=${AGENT_SERVICE_BASE_URL:http://agent:8001}
foodmind.integration.inference.base-url=${INFERENCE_SERVICE_BASE_URL:http://inference:8002}
