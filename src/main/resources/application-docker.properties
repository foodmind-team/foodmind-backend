spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/foodmind}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

logging.level.com.foodmind=INFO
logging.level.org.flywaydb=INFO

foodmind.security.jwt.issuer=${JWT_ISSUER:foodmind-docker}
foodmind.security.jwt.audience=${JWT_AUDIENCE:foodmind-clients}
foodmind.security.jwt.public-key=${JWT_PUBLIC_KEY:docker-development-placeholder}
foodmind.security.delegation.issuer=${DELEGATION_JWT_ISSUER:foodmind-backend-docker}
foodmind.chat.agent.base-url=${CHAT_AGENT_BASE_URL:http://chat:8001}
foodmind.cooking.agent.base-url=${COOKING_AGENT_BASE_URL:http://cooking:8003}
foodmind.cooking.task.poll-enabled=${COOKING_TASK_POLL_ENABLED:true}
foodmind.recommendation.agent.base-url=${RECOMMENDATION_AGENT_BASE_URL:http://recommendation:8004}
