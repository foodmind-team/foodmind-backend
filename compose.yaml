services:
  postgres:
    image: postgres:18.4
    container_name: foodmind-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodmind}
      POSTGRES_USER: ${POSTGRES_USER:-foodmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodmind_local_password}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - foodmind-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-foodmind} -d $${POSTGRES_DB:-foodmind}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: foodmind-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MEDIA_S3_PORT:-9000}:9000"
      - "${MEDIA_S3_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-local-minio-password-change-me}
    volumes:
      - foodmind-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  foodmind-postgres-data:
  foodmind-minio-data:
